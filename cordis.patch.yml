# dsh bundle patch: inserts this plugin into a profile's layer stack.
# `dsh plugin --profile <name> add <repo>` composes this patch automatically
# (see package.json → dsh.bundle). When used as an agent PRESET instead, copy
# the whole `preset/` directory into the user preset root and name it
# `anchor-seed` — do not combine both installation paths.
- insert:
    - id: anchor-seed
      name: '@deepseek-ai/dsh-anchor-seed'
      config:
        # The preset's real prompt, placed after the elevation notice inside
        # the guide file. Leave empty (default) to auto-capture the non-persona
        # prompt sections assembled for the session.
        elevationPrompt: ''

    # Floating panel companion row (browser half + empty host half). It rides a
    # subpath of the same package so the client-modules scanner can hot-add it
    # as a NEW entry id without invalidating the cached metadata of the host
    # row above. In Web it registers the collapsible/draggable overlay: the
    # injection switch, the thinking-chain health readout, and the injected-text
    # editor. Self-contained preset installs do not mount this row (no panel).
    - id: anchor-seed-panel
      name: '@deepseek-ai/dsh-anchor-seed/panel'
      config: {}
